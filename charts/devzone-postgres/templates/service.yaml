apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: {{ .Values.port }}
      targetPort: 5432
