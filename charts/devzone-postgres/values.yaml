# The one definition of PostgreSQL: the helm-direct path installs this chart
# (internal/platform/helm) as the release postgres. The
# secret postgres-admin (superuser password) is created apart by devzone,
# never by the chart (#516: secrets out of Git).
image: postgres:16.15-alpine
# Port of the Service (the container always listens on 5432)
port: 5432
# Memory request of the container
memory: 256Mi
# Name of the volume claim template mounted on the container
claim: donnees
# Size of the data volume (POSTGRES_TAILLE of the helm-direct path)
size: 5Gi
resources:
  requests:
    cpu: 100m
