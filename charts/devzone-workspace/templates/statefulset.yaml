apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devzone-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "devzone-workspace.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
    spec:
      serviceAccountName: {{ include "devzone-workspace.serviceAccountName" . }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: etat
              mountPath: /etat
        - name: docker
          image: {{ .Values.sidecar.image }}
          securityContext:
            privileged: {{ .Values.sidecar.privileged }}
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.workspace.storageClass }}
        storageClassName: {{ .Values.persistence.workspace.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.workspace.size }}
    - metadata:
        name: etat
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.etat.storageClass }}
        storageClassName: {{ .Values.persistence.etat.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.etat.size }}
