apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devzone-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "devzone-workspace.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  # The PVCs (projects, logins) are never deleted with the StatefulSet.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
    spec:
      serviceAccountName: {{ include "devzone-workspace.serviceAccountName" . }}
      # Pod as user vscode (UID 1000), never root: the HOME of the workspace is
      # /home/vscode, where the logins are mounted. fsGroup 1000 makes the state
      # volume writable by vscode. Settings in values.yaml (securityContext).
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      # Native sidecars (restartPolicy: Always, Kubernetes 1.29+): they start
      # before the workspace container, and their startupProbe holds that start
      # until they answer. None gets extra rights and none declares a port: they only
      # listen on 127.0.0.1 of the pod.
      initContainers:
        # etat-init: creates the directories of the state volume (identities,
        # logins, caches). It runs as vscode (UID 1000), with no extra rights. A
        # symbolic link written here would not survive: the workspace container
        # has its own file system. So the workspace mounts each directory
        # (subPath) at its place. The names "etat" stay: existing volumes (#507).
        - name: etat-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- /*
            Helm comment: not in the rendering. The $dirs list comes from
            persistence.state.paths, like the mounts of the workspace.
          */}}
          {{- $dirs := list }}
          {{- range .Values.persistence.state.paths }}
          {{- $dirs = append $dirs (printf "/home/vscode/.devzone-etat/%s" .) }}
          {{- end }}
          command: ["sh", "-c", "mkdir -p {{ join " " $dirs }}"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: etat
              mountPath: /home/vscode/.devzone-etat
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
        # kubedock: Docker API of the pod. Test containers become pods of the
        # namespace, created with the Role of the chart (limited to the namespace).
        - name: kubedock
          image: {{ .Values.kubedock.image }}
          restartPolicy: Always
          {{- /*
            Settings from the lead's trial (#410): server --port-forward --reverse-proxy.
            NAMESPACE comes from the pod, so that kubedock creates the pods in its
            namespace. Helm comment: not in the rendering.
          */}}
          args:
            - server
            - --port-forward
            - --reverse-proxy
            - --timeout
            - {{ .Values.kubedock.timeout | quote }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: 2475
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.kubedock.resources | nindent 12 }}
        # Rootless BuildKit: builds the images, with no extra rights or node socket.
        # Rootless settings of the BuildKit docs for Kubernetes (examples/kubernetes).
        - name: buildkitd
          image: {{ .Values.buildkit.image }}
          restartPolicy: Always
          {{- /*
            --oci-worker-no-process-sandbox: rootless has no process sandbox on
            Kubernetes (BuildKit docs). UID 1000 is the one of the rootless image.
            Helm comment: not in the rendering.
          */}}
          args:
            - --oci-worker-no-process-sandbox
            - --addr=tcp://127.0.0.1:1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            {{- if .Values.buildkit.unconfined }}
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            {{- end }}
          startupProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.buildkit.resources | nindent 12 }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The projects live on the workspace PVC: the container starts there.
          workingDir: /workspaces/projets
          {{- /*
            Without command, the container runs the entrypoint of the image (bash
            for a devcontainer), which ends at once without a terminal: the pod
            loops on restarts. sleep infinity keeps it alive, like VS Code for a
            devcontainer; the workstation then enters through kubectl exec. Helm
            comment: not in the rendering.
          */}}
          {{- with .Values.workspace.command }}
          command: {{ toJson . }}
          {{- end }}
          env:
            # HOME of vscode: gh, claude, opencode... write their logins in the
            # paths mounted from the state volume (not in the home of root).
            - name: HOME
              value: /home/vscode
            # Marker of the Kubernetes workspace: devzone agent runs opencode here (#431)
            - name: DEVZONE_WORKSPACE
              value: kubernetes
            # Root of the devzone projects in the Kubernetes workspace (#503)
            - name: DEVZONE_RACINE
              value: /workspaces/projets
            # Global npm prefix, stored on the mounted state volume (#503)
            - name: NPM_CONFIG_PREFIX
              value: /home/vscode/.local/npm
            # Image PATH plus the npm global bin, installed at startup (#503)
            - name: PATH
              value: /home/vscode/.local/npm/bin:/usr/local/share/nvm/current/bin:/usr/local/sdkman/bin:/usr/local/sdkman/candidates/java/current/bin:/usr/local/sdkman/candidates/gradle/current/bin:/usr/local/sdkman/candidates/maven/current/bin:/usr/local/sdkman/candidates/ant/current/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            # Testcontainers and docker talk to kubedock, and buildctl to BuildKit.
            # Ryuk is off: kubedock cleans the test containers up itself.
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2475
            - name: TESTCONTAINERS_RYUK_DISABLED
              value: "true"
            - name: TESTCONTAINERS_CHECKS_DISABLE
              value: "true"
            - name: BUILDKIT_HOST
              value: tcp://127.0.0.1:1234
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspaces/projets
            - name: etat
              mountPath: /home/vscode/.devzone-etat
            # Identities and caches: each path of the state volume is mounted at
            # its usual place (gh, git, Claude Code, opencode, devzone agent, caches).
            {{- range .Values.persistence.state.paths }}
            - name: etat
              subPath: {{ . | quote }}
              mountPath: {{ printf "/home/vscode/%s" . | quote }}
            {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: workspace
        annotations:
          # The projects are never deleted by helm uninstall (#399).
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.workspace.storageClass }}
        storageClassName: {{ .Values.workspace.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.workspace.size }}
    - metadata:
        name: etat
        annotations:
          # The PVC survives the uninstall of the chart (logins kept). The real
          # protection is persistentVolumeClaimRetentionPolicy above.
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.state.storageClass }}
        storageClassName: {{ .Values.persistence.state.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.state.size }}
