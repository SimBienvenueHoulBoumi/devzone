apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devzone-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "devzone-workspace.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
    spec:
      serviceAccountName: {{ include "devzone-workspace.serviceAccountName" . }}
      # Sidecars natifs (restartPolicy: Always, Kubernetes 1.29+) : ils demarrent
      # avant le conteneur workspace, et leur startupProbe bloque ce demarrage tant
      # qu'ils ne repondent pas. Aucun n'est privilegie, et aucun ne declare de port :
      # ils n'ecoutent que sur 127.0.0.1 du pod.
      initContainers:
        # kubedock : API Docker du pod. Les conteneurs de test deviennent des pods du
        # namespace, crees avec le Role du chart (limite au namespace).
        - name: kubedock
          image: {{ .Values.kubedock.image }}
          restartPolicy: Always
          {{- /*
            Reglages de l'essai du lead (#410) : server --port-forward --reverse-proxy.
            NAMESPACE vient du pod, pour que kubedock cree les pods dans son namespace.
            Commentaire Helm : il ne figure pas dans le rendu.
          */}}
          args:
            - server
            - --port-forward
            - --reverse-proxy
            - --timeout
            - {{ .Values.kubedock.delai | quote }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: 2475
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.kubedock.resources | nindent 12 }}
        # BuildKit rootless : construit les images, sans privilege ni socket du noeud.
        # Reglages rootless de la doc BuildKit pour Kubernetes (examples/kubernetes).
        - name: buildkitd
          image: {{ .Values.buildkit.image }}
          restartPolicy: Always
          {{- /*
            --oci-worker-no-process-sandbox : rootless n'a pas de sandbox de processus
            sur Kubernetes (doc BuildKit). L'UID 1000 est celui de l'image rootless.
            Commentaire Helm : il ne figure pas dans le rendu.
          */}}
          args:
            - --oci-worker-no-process-sandbox
            - --addr=tcp://127.0.0.1:1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            {{- if .Values.buildkit.unconfined }}
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            {{- end }}
          startupProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.buildkit.resources | nindent 12 }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /*
            Sans command, le conteneur lance l'entrypoint de l'image (bash pour un
            devcontainer), qui se termine aussitot faute de terminal : le pod boucle
            en redemarrages. sleep infinity le garde en vie, comme VS Code pour un
            devcontainer ; le poste entre ensuite par kubectl exec. Commentaire Helm :
            il ne figure pas dans le rendu.
          */}}
          {{- with .Values.workspace.command }}
          command: {{ toJson . }}
          {{- end }}
          env:
            # Testcontainers et docker parlent a kubedock, et buildctl a BuildKit.
            # Ryuk est coupe : kubedock nettoie les conteneurs de test lui-meme.
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2475
            - name: TESTCONTAINERS_RYUK_DISABLED
              value: "true"
            - name: TESTCONTAINERS_CHECKS_DISABLE
              value: "true"
            - name: BUILDKIT_HOST
              value: tcp://127.0.0.1:1234
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: etat
              mountPath: /etat
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.workspace.storageClass }}
        storageClassName: {{ .Values.persistence.workspace.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.workspace.size }}
    - metadata:
        name: etat
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.etat.storageClass }}
        storageClassName: {{ .Values.persistence.etat.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.etat.size }}
