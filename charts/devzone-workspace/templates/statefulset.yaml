apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devzone-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "devzone-workspace.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  # Les PVC (projets, connexions) ne sont jamais supprimes avec le StatefulSet.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
    spec:
      serviceAccountName: {{ include "devzone-workspace.serviceAccountName" . }}
      # Pod en utilisateur vscode (UID 1000), jamais root : le HOME du workspace est
      # /home/vscode, ou sont montees les connexions. fsGroup 1000 rend le volume etat
      # ecrit par vscode. Reglages dans values.yaml (securityContext).
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      # Sidecars natifs (restartPolicy: Always, Kubernetes 1.29+) : ils demarrent
      # avant le conteneur workspace, et leur startupProbe bloque ce demarrage tant
      # qu'ils ne repondent pas. Aucun n'est privilegie, et aucun ne declare de port :
      # ils n'ecoutent que sur 127.0.0.1 du pod.
      initContainers:
        # etat-init : cree les dossiers du volume etat (identites, connexions,
        # caches). Il tourne en vscode (UID 1000), sans privilege. Un lien symbolique
        # ecrit ici ne survivrait pas : le conteneur workspace a son propre systeme
        # de fichiers. Le workspace monte donc chaque dossier (subPath) a sa place.
        - name: etat-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- /*
            Commentaire Helm : il ne figure pas dans le rendu. La liste $dirs vient
            de persistence.etat.chemins, comme les montages du workspace.
          */}}
          {{- $dirs := list }}
          {{- range .Values.persistence.etat.chemins }}
          {{- $dirs = append $dirs (printf "/home/vscode/.devzone-etat/%s" .) }}
          {{- end }}
          command: ["sh", "-c", "mkdir -p {{ join " " $dirs }}"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: etat
              mountPath: /home/vscode/.devzone-etat
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
        # kubedock : API Docker du pod. Les conteneurs de test deviennent des pods du
        # namespace, crees avec le Role du chart (limite au namespace).
        - name: kubedock
          image: {{ .Values.kubedock.image }}
          restartPolicy: Always
          {{- /*
            Reglages de l'essai du lead (#410) : server --port-forward --reverse-proxy.
            NAMESPACE vient du pod, pour que kubedock cree les pods dans son namespace.
            Commentaire Helm : il ne figure pas dans le rendu.
          */}}
          args:
            - server
            - --port-forward
            - --reverse-proxy
            - --timeout
            - {{ .Values.kubedock.delai | quote }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: 2475
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.kubedock.resources | nindent 12 }}
        # BuildKit rootless : construit les images, sans privilege ni socket du noeud.
        # Reglages rootless de la doc BuildKit pour Kubernetes (examples/kubernetes).
        - name: buildkitd
          image: {{ .Values.buildkit.image }}
          restartPolicy: Always
          {{- /*
            --oci-worker-no-process-sandbox : rootless n'a pas de sandbox de processus
            sur Kubernetes (doc BuildKit). L'UID 1000 est celui de l'image rootless.
            Commentaire Helm : il ne figure pas dans le rendu.
          */}}
          args:
            - --oci-worker-no-process-sandbox
            - --addr=tcp://127.0.0.1:1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            {{- if .Values.buildkit.unconfined }}
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            {{- end }}
          startupProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.buildkit.resources | nindent 12 }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Les projets vivent sur le PVC workspace : le conteneur y demarre.
          workingDir: /workspaces/projets
          {{- /*
            Sans command, le conteneur lance l'entrypoint de l'image (bash pour un
            devcontainer), qui se termine aussitot faute de terminal : le pod boucle
            en redemarrages. sleep infinity le garde en vie, comme VS Code pour un
            devcontainer ; le poste entre ensuite par kubectl exec. Commentaire Helm :
            il ne figure pas dans le rendu.
          */}}
          {{- with .Values.workspace.command }}
          command: {{ toJson . }}
          {{- end }}
          env:
            # HOME de vscode : gh, claude, opencode... ecrivent leurs connexions dans
            # les chemins montes depuis le volume etat (et non dans le home de root).
            - name: HOME
              value: /home/vscode
            # Repère du workspace Kubernetes : devzone agent lance opencode ici (#431)
            - name: DEVZONE_WORKSPACE
              value: kubernetes
            # Testcontainers et docker parlent a kubedock, et buildctl a BuildKit.
            # Ryuk est coupe : kubedock nettoie les conteneurs de test lui-meme.
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2475
            - name: TESTCONTAINERS_RYUK_DISABLED
              value: "true"
            - name: TESTCONTAINERS_CHECKS_DISABLE
              value: "true"
            - name: BUILDKIT_HOST
              value: tcp://127.0.0.1:1234
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspaces/projets
            - name: etat
              mountPath: /home/vscode/.devzone-etat
            # Identites et caches : chaque chemin du volume etat est monte a son
            # emplacement habituel (gh, git, Claude Code, opencode, devzone agent, caches).
            {{- range .Values.persistence.etat.chemins }}
            - name: etat
              subPath: {{ . | quote }}
              mountPath: {{ printf "/home/vscode/%s" . | quote }}
            {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: workspace
        annotations:
          # Les projets ne sont jamais supprimes par helm uninstall (#399).
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.workspace.storageClass }}
        storageClassName: {{ .Values.workspace.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.workspace.taille }}
    - metadata:
        name: etat
        annotations:
          # Le PVC survit a la desinstallation du chart (connexions gardees). La
          # vraie protection est persistentVolumeClaimRetentionPolicy ci-dessous.
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.etat.storageClass }}
        storageClassName: {{ .Values.persistence.etat.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.etat.size }}
