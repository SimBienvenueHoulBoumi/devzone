apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devzone-workspace
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
subjects:
  - kind: ServiceAccount
    name: {{ include "devzone-workspace.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devzone-workspace
