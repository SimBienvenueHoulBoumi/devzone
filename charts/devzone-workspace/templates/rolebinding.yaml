apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devzone-workspace
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devzone-workspace.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devzone-workspace
