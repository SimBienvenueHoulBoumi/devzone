apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devzone-workspace
  namespace: {{ .Release.Namespace }}
# Lecture seule du namespace, rien de plus. Le pod n'écrit pas sur le cluster :
# les services s'installent depuis le poste (CLI devzone, kubectl de l'hôte).
# Aucun accès aux mots de passe, jetons ni identités : ils restent hors de
# portée du pod, qui exécute du code de projet.
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
