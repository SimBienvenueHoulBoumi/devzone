apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devzone-workspace
  namespace: {{ .Release.Namespace }}
# Droits de kubedock (0.23.0, lus dans ses sources), limites au namespace :
# pods (creer et supprimer les conteneurs de test, les lister et les suivre),
# pods/log, pods/exec et pods/portforward (logs, commandes, ports), services et
# configmaps (crees et supprimes avec les pods). Aucun droit sur les secrets ni
# les deployments : kubedock 0.23.0 ne les utilise pas. Le pod execute du code de
# projet : pas de droit sur les autres namespaces, ni sur le cluster.
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["list", "create", "delete"]
