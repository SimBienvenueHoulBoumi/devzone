apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devzone-workspace
  namespace: {{ .Release.Namespace }}
# Rights of kubedock (0.23.0, read in its sources), limited to the namespace:
# pods (create and delete the test containers, list and follow them),
# pods/log, pods/exec and pods/portforward (logs, commands, ports), services and
# configmaps (created and deleted with the pods). No right on secrets or
# deployments: kubedock 0.23.0 does not use them. The pod runs project code:
# no right on other namespaces, nor on the cluster.
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["list", "create", "delete"]
