{{- if and .Values.egressProxy.enabled (eq .Values.egressProxy.mode "strict") -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devzone-workspace.fullname" . }}-egress-strict
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
    app.kubernetes.io/component: egress-proxy
spec:
  podSelector:
    matchExpressions:
      - key: devzone.io/agent-session
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
              app.kubernetes.io/component: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end -}}
