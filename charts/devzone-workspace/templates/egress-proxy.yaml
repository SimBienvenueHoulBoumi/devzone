{{- if .Values.egressProxy.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devzone-workspace.fullname" . }}-egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
    app.kubernetes.io/component: egress-proxy
data:
  squid.conf: |
    http_port 3128
    max_filedescriptors 1024
    cache deny all
    access_log daemon:/var/log/squid/access.log
    pid_filename /tmp/squid.pid
{{- if eq .Values.egressProxy.mode "strict" }}
{{- range .Values.egressProxy.allowedDomains }}
    acl allowed dstdomain {{ . }}
{{- end }}
    acl SSL_ports port 443
    acl CONNECT method CONNECT
    http_access allow CONNECT SSL_ports allowed
    http_access allow allowed
    http_access deny all
{{- else }}
    http_access allow all
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devzone-workspace.fullname" . }}-egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
      app.kubernetes.io/component: egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
        app.kubernetes.io/part-of: devzone
        app.kubernetes.io/managed-by: devzone
        app.kubernetes.io/component: egress-proxy
    spec:
      volumes:
        - name: config
          configMap:
            name: {{ include "devzone-workspace.fullname" . }}-egress-proxy
        - name: logs
          emptyDir: {}
      containers:
        - name: squid
          image: {{ .Values.egressProxy.image }}
          ports:
            - name: proxy
              containerPort: 3128
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
            - name: logs
              mountPath: /var/log/squid
          resources:
            {{- toYaml .Values.egressProxy.resources | nindent 12 }}
        - name: access-log
          image: busybox:1.36
          command: ["sh", "-c", "tail -F /var/log/squid/access.log 2>/dev/null"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/squid
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
    app.kubernetes.io/component: egress-proxy
    devzone.io/egress-mode: {{ .Values.egressProxy.mode | quote }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "devzone-workspace.name" . }}-egress-proxy
    app.kubernetes.io/component: egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
{{- end -}}
