replicaCount: 1

image:
  repository: ghcr.io/simbienvenuehoulboumi/devzone-workspace
  tag: ""
  pullPolicy: IfNotPresent

# Sidecar Docker du pod : le conteneur workspace s'en sert (docker, Testcontainers).
# Privilegie, il ecoute sur 127.0.0.1:2375 du pod, jamais expose par le Service.
sidecar:
  image: docker:27-dind
  privileged: true
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"

resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

persistence:
  workspace:
    size: 20Gi
    storageClass: ""
  etat:
    size: 10Gi
    storageClass: ""
  # Stockage du Docker du pod (/var/lib/docker) : images gardees entre deux redemarrages.
  docker:
    size: 30Gi
    storageClass: ""

serviceAccount:
  name: devzone-workspace
  create: true

networkPolicy:
  enabled: true
