replicaCount: 1

# Securite du pod : utilisateur vscode (UID 1000), jamais root. Les sidecars
# heritent de runAsUser (kubedock inclus, qui n'en declare pas) ; buildkit le
# redeclare, rootless en 1000.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

image:
  repository: ghcr.io/simbienvenuehoulboumi/devzone-workspace
  tag: ""
  pullPolicy: IfNotPresent

# Docker sans privilege. kubedock (API Docker) : Testcontainers et docker lancent
# leurs conteneurs comme des pods du namespace, ecoute sur 127.0.0.1:2475 du pod.
kubedock:
  image: joyrex2001/kubedock:0.23.0
  # Delai accorde a kubedock pour demarrer un conteneur de test (--timeout). Par
  # defaut, kubedock n'attend qu'une minute : au premier lancement sur un noeud, le
  # pod de test doit tirer son image, et ce tirage depasse souvent cette minute.
  # Sans ce delai, kubedock abandonne (« timeout starting container »).
  delai: 5m
  # Cleanup of kubedock-managed test pods (#514). --reapmax reaps resources older
  # than this age (0 disables reaping); --prune-start removes leftover kubedock
  # resources before the API starts. https://github.com/joyrex2001/kubedock/blob/master/config.md
  reapmax: 30m
  pruneStart: true
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"

# BuildKit rootless : construit les images (buildctl, BUILDKIT_HOST), ecoute sur
# 127.0.0.1:1234 du pod. Jamais privilegie.
buildkit:
  image: moby/buildkit:v0.34.2-rootless
  # seccomp et AppArmor Unconfined : BuildKit a besoin de mount et unshare, que les
  # profils par defaut bloquent (docs BuildKit, rootless). AppArmor : Kubernetes 1.30+.
  unconfined: true
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"

# Conteneur workspace et volume de ses projets (#399) : le PVC workspace est
# monte sur /workspaces/projets, ou le conteneur demarre (workingDir).
workspace:
  # Command: run workspace-init.sh in the foreground first, then keep the pod
  # alive with sleep infinity (like VS Code for a devcontainer) (#503). The init
  # script runs before exec, its errors are ignored (|| true) and its journal is
  # ~/.local/state/devzone/init.log. Empty = image default command.
  command: ["bash", "-c", "mkdir -p \"$HOME/.local/state/devzone\"; bash /usr/local/share/devzone/.devcontainer/workspace-init.sh >>\"$HOME/.local/state/devzone/init.log\" 2>&1 || true; exec sleep infinity"]
  # Taille du volume des projets.
  taille: 20Gi
  storageClass: ""

resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

persistence:
  # Identités, connexions et caches, gardés d'un redémarrage à l'autre. Chaque
  # chemin (relatif au home de vscode) est monté depuis ce volume à son
  # emplacement habituel ; l'initContainer etat-init crée les dossiers d'abord.
  etat:
    size: 10Gi
    storageClass: ""
    chemins:
      - .config/gh
      - .config/git
      - .claude
      - .config/opencode
      - .local/share/opencode
      - .local/state/oc-lancer
      - .m2
      - .gradle
      - .local/share/pnpm
      - .local/npm
      - .local/state/devzone

serviceAccount:
  name: devzone-workspace
  create: true

networkPolicy:
  enabled: true
  # Entree limitee au namespace. Sortie libre par defaut : un poste de dev a
  # besoin d'Internet (Maven, npm, images Docker). Mettre true limite la sortie
  # au namespace et au DNS (kube-system). La liste blanche de sortie est #220.
  sortieRestreinte: false
