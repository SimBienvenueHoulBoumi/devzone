replicaCount: 1

# Pod security: user vscode (UID 1000), never root. The sidecars inherit
# runAsUser (kubedock included, which declares none); buildkit declares it
# again, rootless as 1000.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

image:
  repository: ghcr.io/simbienvenuehoulboumi/devzone-workspace
  tag: ""
  pullPolicy: IfNotPresent

# Docker with no extra rights. kubedock (Docker API): Testcontainers and docker
# start their containers as pods of the namespace; it listens on 127.0.0.1:2475
# of the pod.
kubedock:
  image: joyrex2001/kubedock:0.23.0
  # Time given to kubedock to start a test container (--timeout). By default
  # kubedock waits one minute only: on the first run on a node, the test pod
  # must pull its image, which often takes longer. Without this timeout,
  # kubedock gives up ("timeout starting container").
  timeout: 5m
  # Cleanup of kubedock-managed test pods (#514). --reapmax reaps resources older
  # than this age (0 disables reaping); --prune-start removes leftover kubedock
  # resources before the API starts. https://github.com/joyrex2001/kubedock/blob/master/config.md
  reapmax: 30m
  pruneStart: true
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"

# Rootless BuildKit: builds the images (buildctl, devzone build); listens on
# 127.0.0.1:1234 of the pod, with no extra rights.
buildkit:
  image: moby/buildkit:v0.34.2-rootless
  # seccomp and AppArmor Unconfined: BuildKit needs mount and unshare, which the
  # default profiles block (BuildKit docs, rootless). AppArmor: Kubernetes 1.30+.
  unconfined: true
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"

# Workspace container and the volume of its projects (#399): the workspace PVC
# is mounted on /workspaces/projets, where the container starts (workingDir).
workspace:
  # Command: run workspace-init.sh in the foreground first, then keep the pod
  # alive with sleep infinity (like VS Code for a devcontainer) (#503). The init
  # script runs before exec, its errors are ignored (|| true) and its journal is
  # ~/.local/state/devzone/init.log. Empty = image default command.
  command: ["bash", "-c", "mkdir -p \"$HOME/.local/state/devzone\"; bash /usr/local/share/devzone/.devcontainer/workspace-init.sh >>\"$HOME/.local/state/devzone/init.log\" 2>&1 || true; exec sleep infinity"]
  # Size of the projects volume.
  size: 20Gi
  storageClass: ""

resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

persistence:
  # Identities, logins and caches, kept from one restart to the next. Each path
  # (relative to the home of vscode) is mounted from this volume at its usual
  # place; the etat-init initContainer creates the directories first. The
  # volume itself keeps its historical name "etat" (existing data, #507).
  state:
    size: 10Gi
    storageClass: ""
    paths:
      - .config/gh
      - .config/git
      - .claude
      - .config/opencode
      - .local/share/opencode
      - .local/state/oc-lancer
      - .m2
      - .gradle
      - .local/share/pnpm
      - .local/npm
      - .local/state/devzone

serviceAccount:
  name: devzone-workspace
  create: true

networkPolicy:
  enabled: true
  # Ingress limited to the namespace. Egress open by default: a development
  # workstation needs the Internet (Maven, npm, Docker images). true limits the
  # egress to the namespace and to DNS (kube-system). The egress allow list is #220.
  restrictEgress: false
