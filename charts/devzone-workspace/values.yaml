replicaCount: 1

image:
  repository: ghcr.io/simbienvenuehoulboumi/devzone-workspace
  tag: ""
  pullPolicy: IfNotPresent

# Docker sans privilege. kubedock (API Docker) : Testcontainers et docker lancent
# leurs conteneurs comme des pods du namespace, ecoute sur 127.0.0.1:2475 du pod.
kubedock:
  image: joyrex2001/kubedock:0.23.0
  # Delai accorde a kubedock pour demarrer un conteneur de test (--timeout). Par
  # defaut, kubedock n'attend qu'une minute : au premier lancement sur un noeud, le
  # pod de test doit tirer son image, et ce tirage depasse souvent cette minute.
  # Sans ce delai, kubedock abandonne (« timeout starting container »).
  delai: 5m
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"

# BuildKit rootless : construit les images (buildctl, BUILDKIT_HOST), ecoute sur
# 127.0.0.1:1234 du pod. Jamais privilegie.
buildkit:
  image: moby/buildkit:v0.34.2-rootless
  # seccomp et AppArmor Unconfined : BuildKit a besoin de mount et unshare, que les
  # profils par defaut bloquent (docs BuildKit, rootless). AppArmor : Kubernetes 1.30+.
  unconfined: true
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"

# Commande du conteneur workspace : il reste en vie (sleep infinity, comme VS Code
# pour un devcontainer). Vide = commande par defaut de l'image.
workspace:
  command: ["sleep", "infinity"]

resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

persistence:
  workspace:
    size: 20Gi
    storageClass: ""
  etat:
    size: 10Gi
    storageClass: ""

serviceAccount:
  name: devzone-workspace
  create: true

networkPolicy:
  enabled: true
  # Entree limitee au namespace. Sortie libre par defaut : un poste de dev a
  # besoin d'Internet (Maven, npm, images Docker). Mettre true limite la sortie
  # au namespace et au DNS (kube-system). La liste blanche de sortie est #220.
  sortieRestreinte: false
