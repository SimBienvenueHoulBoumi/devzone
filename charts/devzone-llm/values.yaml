# The one definition of the local model: the helm-direct path installs this
# chart (.devcontainer/llm/llm.sh) as the release llm. No Secret: the model is
# public and checked by its sha256.
# Official llama.cpp server image, CPU, pinned build
image: ghcr.io/ggml-org/llama.cpp:server-b12407
# Image of the init container that downloads and checks the model
fetchImage: curlimages/curl:8.11.1
# Port of the Service and of llama-server
port: 8080
# Memory request of the container (the limit is resources.limits.memory)
memory: 6Gi
# Name of the volume claim holding the models; kept when the release goes
claim: llm-models
# Size of the models volume
size: 8Gi
# Context size (-c) and threads (-t) of llama-server
contextSize: 8192
threads: 4
# The model: downloaded only when the file is missing, then its sha256 is
# checked (the file is removed and the pod fails when it differs). The URL is
# pinned to a Hugging Face commit (resolve/<commit>).
# Preset "qwen2.5-coder-7b-instruct-q4_k_m" (default, 4.7 GB):
#   url: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf
#   file: qwen2.5-coder-7b-instruct-q4_k_m.gguf
#   sha256: 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c
# Preset "qwen2.5-coder-3b-instruct-q4_k_m" (light, 2.1 GB; memory=3Gi and
# resources.limits.memory=4Gi):
#   url: https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/f74adce6aa16316c625447af059dbebe4983757c/qwen2.5-coder-3b-instruct-q4_k_m.gguf
#   file: qwen2.5-coder-3b-instruct-q4_k_m.gguf
#   sha256: 724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7
model:
  url: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf
  file: qwen2.5-coder-7b-instruct-q4_k_m.gguf
  sha256: 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c
resources:
  requests:
    cpu: 500m
  limits:
    memory: 7Gi
