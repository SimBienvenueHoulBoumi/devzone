apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: {{ .Release.Namespace }}
  labels:
    app: llm
    app.kubernetes.io/name: llm
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
spec:
  type: ClusterIP
  selector:
    app: llm
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: 8080
