apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: {{ .Release.Namespace }}
  labels:
    app: llm
    app.kubernetes.io/name: llm
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
        app.kubernetes.io/managed-by: devzone
    spec:
      initContainers:
        - name: fetch-model
          image: {{ .Values.fetchImage }}
          securityContext:
            runAsUser: 0
          env:
            - name: MODEL_URL
              value: {{ .Values.model.url | quote }}
            - name: MODEL_FILE
              value: {{ .Values.model.file | quote }}
            - name: MODEL_SHA256
              value: {{ .Values.model.sha256 | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              f="/models/$MODEL_FILE"
              if [ ! -f "$f" ]; then
                echo "downloading $MODEL_FILE (first start: several minutes)"
                curl -fL --retry 5 --retry-delay 5 -C - -o "$f.part" "$MODEL_URL"
                mv "$f.part" "$f"
              fi
              if ! echo "$MODEL_SHA256  $f" | sha256sum -c -; then
                echo "sha256 differs: $MODEL_FILE removed" >&2
                rm -f "$f"
                exit 1
              fi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llm
          image: {{ .Values.image }}:server-{{ .Values.llamaBuild }}
          env:
            - name: THREADS
              value: {{ .Values.threads | quote }}
            - name: MAX_THREADS
              value: {{ .Values.maxThreads | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              t="$THREADS"
              if [ "$t" = auto ]; then
                t="$(nproc)"
                [ "$t" -le "$MAX_THREADS" ] || t="$MAX_THREADS"
              fi
              echo "llama-server: $t threads"
              exec /app/llama-server "$@" -t "$t" --threads-batch "$t"
            - llama-server
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -m
            - /models/{{ .Values.model.file }}
            - -c
            - {{ .Values.contextSize | quote }}
            - --cache-type-k
            - {{ .Values.cacheType | quote }}
            - --cache-type-v
            - {{ .Values.cacheType | quote }}
            - --flash-attn
            - {{ .Values.flashAttention | quote }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.claim }}
