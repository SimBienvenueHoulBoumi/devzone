apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.claim }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: llm
    app.kubernetes.io/name: llm
    app.kubernetes.io/part-of: devzone
    app.kubernetes.io/managed-by: devzone
  annotations:
    # The model is not downloaded again: the volume outlives the release
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.size }}
