# Values of the GitLab of devzone (#396), once the content of
# .devcontainer/gitlab/values.yaml and runner-values.yaml, moved under the
# gitlab and gitlab-runner keys of the wrapper (#538). Services in ClusterIP
# (no Ingress, no load balancer): access through the port-forward relays of the
# container/pod. The runner token lives in the Secret gitlab-runner-secret,
# created apart by the seed (never in Git).
gitlab:
  global:
    edition: ce
    extraEnv:
      GITLAB_PORT: "8929"
    hosts:
      domain: localhost
      https: false
      gitlab:
        name: gitlab.localhost
    ingress:
      enabled: false
      configureCertmanager: false
      tls:
        enabled: false
    gatewayApi:
      configureCertmanager: false
    kas:
      enabled: false
    prometheus:
      install: false
    registry:
      enabled: false
    shell:
      port: 2224
  installCertmanager: false
  prometheus:
    install: false
  registry:
    enabled: false
  gitlab-runner:
    install: false
  nginx-ingress:
    enabled: false
  gitlab:
    gitlab-exporter:
      enabled: false
    webservice:
      service:
        type: ClusterIP
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    sidekiq:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
    gitaly:
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
    gitlab-shell:
      service:
        type: ClusterIP
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  certmanager-issuer: {}
gitlab-runner:
  # Internal URL of the webservice: the chart default is the main instance;
  # the installer of an instance with a suffix overrides it (the value is not
  # templated), the URLs inside the configuration follow .Release.Namespace
  gitlabUrl: http://gitlab-webservice-default.devzone-gitlab.svc:8181
  runners:
    secret: gitlab-runner-secret
    executor: kubernetes
    config: |
      [[runners]]
        clone_url = "http://gitlab-webservice-default.{{ .Release.Namespace }}.svc:8181"
        [runners.kubernetes]
          namespace = "{{ .Release.Namespace }}"
          image = "alpine"
          helper_image_autoset_arch_and_os = true
  rbac:
    create: true
  serviceAccount:
    create: true
  concurrent: 2
