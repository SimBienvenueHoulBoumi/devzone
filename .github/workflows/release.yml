# Releases, flux develop → main (mode tag), sans geste : chaque merge d'un
# ticket dans develop (la validation humaine) publie une préversion
# vX.Y.Z-next.N et tient à jour la PR de livraison develop → main ; la GitHub
# App la merge dès que ses vérifications sont vertes, ce qui publie sur main le
# tag vX.Y.Z et la release (livraison automatique officielle de repowarden :
# delivery-auto, deliveryApproval = auto). Aucune version n'est écrite dans
# les fichiers : elle est portée par le tag. Retour au merge manuel de la
# livraison : delivery-auto: false.
#
# Prérequis : GitHub App (repowarden app init : variable
# REPOWARDEN_APP_CLIENT_ID, secret REPOWARDEN_APP_KEY) ; Settings → Actions →
# General → « Allow GitHub Actions to create and approve pull requests ».
name: release

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 19 * * *" # préversion du soir, si develop a changé
    - cron: "0 7 * * 5" # fenêtre de livraison : le vendredi matin
  workflow_dispatch: # à la main (et urgence) : préversion et demande de livraison

# Une file par branche et par déclencheur ; une demande manuelle ou planifiée
# remplace celle en attente ; un push n'annule jamais un run en cours
concurrency:
  group: release-${{ github.ref_name }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  release:
    uses: simdevWarden/repowarden/.github/workflows/release-auto.yml@v4
    permissions: { contents: write, pull-requests: write, actions: write, checks: read, statuses: write, issues: read }
    with:
      mode: tag
      delivery-schedule: "0 7 * * 5" # même cron que la fenêtre ci-dessus
      # Préversion publiée par le bot à chaque merge sur develop : la PR de
      # livraison est livrable aussitôt (vérification livraison)
      preversion-on-push: true
      # Livraison automatique (repowarden ≥ 4.9) : à chaque merge, la PR de
      # livraison est armée en merge automatique par l'App ; elle part dès que
      # les vérifications exigées sur main (repowarden, livraison) sont vertes
      delivery-on-push: true
      delivery-auto: true
      # GitHub App : la PR de livraison qu'elle ouvre lance sa CI d'elle-même,
      # et son merge déclenche tag et release
      app-client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
    secrets:
      app-key: ${{ secrets.REPOWARDEN_APP_KEY }}

  # Paquet npm (npx devzone <dossier>), publié à chaque release sans jeton
  # (publication de confiance). Activé par la variable REPOWARDEN_NPM ; mise en
  # place, une fois, sur ta machine : npx repowarden npm-publication. Le secret
  # NPM_TOKEN ne sert qu'à la toute première publication.
  npm:
    needs: release
    # Nouvelle release, ou lancement manuel : rattrape la dernière release si
    # elle n'est pas encore sur npm (sans effet sinon)
    if: vars.REPOWARDEN_NPM == 'true' && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    uses: simdevWarden/repowarden/.github/workflows/npm-publish.yml@v4
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  # Suivi des tickets : livrés en préversion → préprod ; publiés, ou livrés sur
  # main sans nouvelle version (ni fix ni feat) → done et fermés
  tickets:
    needs: release
    if: needs.release.outputs.release_created == 'true' || needs.release.outputs.prerelease_created == 'true' || needs.release.outputs.delivered_without_version != ''
    uses: simdevWarden/repowarden/.github/workflows/tickets.yml@v4
    permissions: { contents: write, issues: write, pull-requests: write, statuses: write }
    with:
      tag: ${{ needs.release.outputs.tag_name || needs.release.outputs.prerelease_tag }}
      delivered-sha: ${{ needs.release.outputs.delivered_without_version }}
      app-client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
    secrets:
      app-key: ${{ secrets.REPOWARDEN_APP_KEY }}
