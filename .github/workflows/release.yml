# Releases, develop -> main flow (tag mode), hands off: each ticket merged into
# develop (the human validation) publishes a vX.Y.Z-next.N prerelease and keeps
# the develop -> main delivery PR up to date; the GitHub App merges it as soon as
# its checks are green, which publishes the vX.Y.Z tag and the release on main
# (repowarden official automatic delivery: delivery-auto, deliveryApproval =
# auto). No version is written in the files: the tag carries it. Back to a
# manual merge of the delivery: delivery-auto: false.
#
# Requirements: GitHub App (repowarden app init: variable
# REPOWARDEN_APP_CLIENT_ID, secret REPOWARDEN_APP_KEY); Settings -> Actions ->
# General -> "Allow GitHub Actions to create and approve pull requests".
name: release

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 19 * * *" # evening prerelease, if develop changed
    - cron: "0 7 * * 5" # delivery window: Friday morning
  workflow_dispatch: # by hand (and emergency): prerelease and delivery request

# One queue per branch and per trigger; a manual or scheduled request replaces
# the pending one; a push never cancels a running run
concurrency:
  group: release-${{ github.ref_name }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  release:
    uses: simdevWarden/repowarden/.github/workflows/release-auto.yml@v4
    permissions: { contents: write, pull-requests: write, actions: write, checks: read, statuses: write, issues: read }
    with:
      mode: tag
      delivery-schedule: "0 7 * * 5" # same cron as the window above
      # Prerelease published by the bot at each merge on develop: the delivery
      # PR can be delivered at once (livraison check)
      preversion-on-push: true
      # Automatic delivery (repowarden >= 4.9): at each merge, the App arms the
      # delivery PR for automatic merge; it goes as soon as the checks required
      # on main (repowarden, livraison) are green
      delivery-on-push: true
      delivery-auto: true
      # GitHub App: the delivery PR it opens starts its CI by itself, and its
      # merge triggers tag and release
      app-client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
    secrets:
      app-key: ${{ secrets.REPOWARDEN_APP_KEY }}

  # npm package (npx devzone <folder>), published at each release without token
  # (trusted publishing). Turned on by the REPOWARDEN_NPM variable; set up once,
  # on your machine: npx repowarden npm-publication. The NPM_TOKEN secret is only
  # used for the very first publication.
  npm:
    needs: release
    # New release, or manual run: catches up the last release if it is not on
    # npm yet (no effect otherwise)
    if: vars.REPOWARDEN_NPM == 'true' && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    uses: simdevWarden/repowarden/.github/workflows/npm-publish.yml@v4
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  # Kubernetes workspace image published at each delivery (#486)
  image:
    needs: release
    if: needs.release.outputs.tag_name != ''
    uses: ./.github/workflows/image-workspace.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release.outputs.tag_name }}

  # Ticket tracking: delivered in a prerelease -> preprod; published, or
  # delivered on main without a new version (neither fix nor feat) -> done and closed
  tickets:
    needs: release
    if: needs.release.outputs.release_created == 'true' || needs.release.outputs.prerelease_created == 'true' || needs.release.outputs.delivered_without_version != ''
    uses: simdevWarden/repowarden/.github/workflows/tickets.yml@v4
    permissions: { contents: write, issues: write, pull-requests: write, statuses: write }
    with:
      tag: ${{ needs.release.outputs.tag_name || needs.release.outputs.prerelease_tag }}
      delivered-sha: ${{ needs.release.outputs.delivered_without_version }}
      app-client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
    secrets:
      app-key: ${{ secrets.REPOWARDEN_APP_KEY }}
