# Go checks of the migration to Go (#358, #710): go vet, gofmt, unit tests, a
# cross build of ./cmd/devzone (linux, darwin, windows; amd64, arm64) and the
# 250-line limit of the Go files (manage/scripts/ci/check-go-layout.sh). The bash
# entry point is checked by the bats job of fonctionnel.yml, not here. The package
# job builds the binaries of the npm package (#773) as the publication does:
# setup-node only, no setup-go, so the Go of the runner may be older than go.mod
# and build-binaries.sh must select the toolchain by itself.
name: go

on:
  pull_request:
  push:
    branches: [develop, 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - name: go vet
        run: go vet ./...
      - name: gofmt (a listed file fails the job)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: unit tests
        run: go test ./... -count=1
      - name: cross build of the binary
        run: |
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              GOOS="$goos" GOARCH="$goarch" go build -o "$RUNNER_TEMP/devzone-$goos-$goarch" ./cmd/devzone
            done
          done
      - name: line limit of the Go files
        run: bash manage/scripts/ci/check-go-layout.sh

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ceiling of the packed package (bytes): measured 8754981 plus 10 %, rounded up
      # (raised from 8572000 when the watcher was wired: net is then linked, see
      # contributing.md)
      MAX_PACKED: 9631000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: build the six binaries (prepack script)
        run: bash manage/scripts/ci/build-binaries.sh
      - name: package contents and size (npm pack --dry-run)
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const pack = JSON.parse(require("fs").readFileSync(process.argv[1]))[0];
            const paths = pack.files.map((f) => f.path);
            const want = ["SHA256SUMS", "devzone-linux-amd64", "devzone-linux-arm64",
              "devzone-darwin-amd64", "devzone-darwin-arm64",
              "devzone-windows-amd64.exe", "devzone-windows-arm64.exe"].map((n) => "bin/" + n);
            const missing = want.filter((p) => !paths.includes(p));
            if (missing.length > 0) { console.error("missing from the package: " + missing.join(" ")); process.exit(1); }
            const max = Number(process.env.MAX_PACKED);
            console.log("package: " + paths.length + " files, " + pack.size + " bytes packed, " + pack.unpackedSize + " unpacked");
            if (pack.size > max) { console.error("package too big: " + pack.size + " > " + max); process.exit(1); }
          ' "$RUNNER_TEMP/pack.json"
      - name: the linux-amd64 binary prints the version of package.json
        run: |
          expected="$(node -p 'require("./package.json").version')"
          actual="$(bin/devzone-linux-amd64 --version)"
          echo "package.json: $expected, binary: $actual"
          [ "$actual" = "$expected" ]
