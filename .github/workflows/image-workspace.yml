name: image-workspace

# Full devcontainer image (Dockerfile + features of devcontainer.json), built by
# the official devcontainers/ci action, pinned version.
on:
  pull_request:
  push:
    tags:
      - "v*"
  # Called by release.yml at every delivery (#486), or by hand to publish a version
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      # The pod CLI binary enters the image through the build context: the Dockerfile
      # copies .devcontainer/ whole, so the binary built here ships with the image (#754).
      - name: Build devzone-pod
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o ".devcontainer/bin/devzone-pod-linux-$arch" ./cmd/devzone-pod
          done
      # Public DNS for the runner Docker: its DNS sometimes fails on archive.ubuntu.com (#468)
      - name: Runner Docker DNS
        run: bash manage/scripts/ci/ci-dns.sh
      # One retry of the build (#758), as in the publish job below: a corrupt SDKMAN
      # download fails the first attempt now and then, even with a pinned Maven.
      # The retry runs only after a failure, after a pause; its failure fails the job.
      - name: Build (first attempt)
        id: build
        continue-on-error: true
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/simbienvenuehoulboumi/devzone-workspace
          imageTag: ${{ github.sha }}
          push: never
      - name: Pause before the retry
        if: steps.build.outcome == 'failure'
        run: sleep 120
      - name: Build (retry)
        if: steps.build.outcome == 'failure'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/simbienvenuehoulboumi/devzone-workspace
          imageTag: ${{ github.sha }}
          push: never

  publish:
    # Tag given (call from release.yml or run by hand) or push of a v* tag
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      # Image tag: version without the v (vX.Y.Z -> X.Y.Z), also pushed as latest
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      # The pod CLI binary enters the image through the build context: the Dockerfile
      # copies .devcontainer/ whole, so the binary built here ships with the image (#754).
      - name: Build devzone-pod
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o ".devcontainer/bin/devzone-pod-linux-$arch" ./cmd/devzone-pod
          done
      - name: Image version
        id: version
        run: echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-architecture image: Apple Silicon Mac (arm64) and amd64 workstations (#494)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One retry of the build and push (#758): a corrupt SDKMAN download can fail
      # the first attempt. The retry runs only after a failure, after a pause (a
      # retry started at once fell in the same bad window, #685); its failure
      # fails the job. Both steps use the same action and inputs.
      - name: Build and push (first attempt)
        id: publish
        continue-on-error: true
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/simbienvenuehoulboumi/devzone-workspace
          imageTag: ${{ steps.version.outputs.version }},latest
          platform: linux/amd64,linux/arm64
          push: always
      - name: Pause before the retry
        if: steps.publish.outcome == 'failure'
        run: sleep 120
      - name: Build and push (retry)
        if: steps.publish.outcome == 'failure'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/simbienvenuehoulboumi/devzone-workspace
          imageTag: ${{ steps.version.outputs.version }},latest
          platform: linux/amd64,linux/arm64
          push: always
