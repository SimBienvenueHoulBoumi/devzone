name: image-workspace

# Image complète du devcontainer (Dockerfile + features de devcontainer.json),
# construite par l'action officielle devcontainers/ci, version figée.
on:
  pull_request:
  push:
    tags:
      - "v*"
  # Appelé par release.yml à chaque livraison (#486), ou à la main pour publier une version
  workflow_call:
    inputs:
      tag:
        description: Tag de la release (vX.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DNS publics pour le Docker du runner : son DNS échoue parfois sur archive.ubuntu.com (#468)
      - name: DNS du Docker du runner
        run: bash manage/scripts/ci-dns.sh
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/simbienvenuehoulboumi/devzone-workspace
          imageTag: ${{ github.sha }}
          push: never

  publish:
    # Tag fourni (appel par release.yml ou lancement à la main) ou push d un tag v*
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      # Tag de l'image : version sans le « v » (vX.Y.Z → X.Y.Z), aussi poussée en latest
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version de l'image
        id: version
        run: echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image multi-architecture : Mac Apple Silicon (arm64) et postes amd64 (#494)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/simbienvenuehoulboumi/devzone-workspace
          imageTag: ${{ steps.version.outputs.version }},latest
          platform: linux/amd64,linux/arm64
          push: always
