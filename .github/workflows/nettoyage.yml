# PR branches deleted after merge (GitHub automatic deletion is off in the
# develop flow: it would delete develop when the delivery is merged). main,
# develop and any branch still the source of an open PR are kept.
name: nettoyage

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  nettoyage:
    uses: simdevWarden/repowarden/.github/workflows/nettoyage-branches.yml@v4
    permissions:
      contents: write
      pull-requests: read
