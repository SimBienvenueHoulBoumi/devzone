# Functional tests: builds an isolated devzone and plays the scenarios of a
# user (tools, modules, Kubernetes with kind, hooks, restart, rebuild); same
# script as locally (make test-fonctionnel). Job cli: the CLI typed in a real
# terminal, each command with a maximum time (make test-cli). Job windows: line
# endings, npm package (installed in an isolated prefix, never the global one of
# the machine) and devzone command on windows-latest (manage/test/windows.sh,
# runnable locally), then the same path through cmd with a really global install
# (npm .cmd shim, the case of a Windows user). Job ia-arm64: AI assistants
# installed at the pinned versions on arm64 (Apple Silicon Mac), claude and
# opencode checked.
#
# Required to merge, in develop as in main (livraison), through the
# tests-conteneur summary check (requiredChecks, .repowarden.conf). The workflow
# runs on every PR (no paths filter: the summary must always exist); the
# changements job decides by path: fonctionnel, cli, windows and ia-arm64 (about
# ten minutes each, 15 for windows) only run when the PR touches the container,
# the tests, the CLI, .gitattributes or package.json (manage/test/ci-conteneur.sh);
# a docs-only PR does not wait. Job bats: bats manage/test/ (unit tests) on every
# PR, with no path decision (a test can read the docs or a workflow), on ubuntu
# and on macOS with the system bash 3.2 (host scripts). tests-conteneur passes
# when bats passed and the four others passed, or did not have to run; a failure
# or a cancellation makes it fail. Push on develop and main: bats only. By hand:
# everything runs.
name: fonctionnel

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonctionnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tester: ${{ steps.detection.outputs.tester }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # base and head of the PR, for the list of changed files
      - name: Changed files touching the container, the tests or the CLI
        id: detection
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE...$TETE" >changes.txt
              cat changes.txt
              tester="$(bash manage/test/ci-conteneur.sh a-tester <changes.txt)"
              ;;
            push) tester=false ;; # develop and main: already tested by the PR, bats only
            *) tester=true ;;     # by hand: everything runs
          esac
          echo "tester=$tester"
          echo "tester=$tester" >>"$GITHUB_OUTPUT"

  fonctionnel:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Public DNS for the runner Docker: its DNS sometimes fails on archive.ubuntu.com (#468)
      - name: Runner Docker DNS
        run: bash manage/scripts/ci-dns.sh
      - run: bash manage/test/fonctionnel.sh

  cli:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Public DNS for the runner Docker: its DNS sometimes fails on archive.ubuntu.com (#468)
      - name: Runner Docker DNS
        run: bash manage/scripts/ci-dns.sh
      - run: bash manage/test/cli-terminal.sh

  windows:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Windows workstation settings; before the checkout, otherwise the copy is already made
      - name: Checkout with core.autocrlf true (like a Windows workstation)
        shell: cmd
        run: |
          git config --global core.autocrlf true
          git config --global core.safecrlf false
      - uses: actions/checkout@v7
      # Line endings are checked by manage/test/windows.sh (same rule as the guard of
      # manage/test/cli.bats: every tracked file starting with #!, Makefile)
      - name: Windows tests under Git Bash (manage/test/windows.sh)
        shell: bash
        run: bash manage/test/windows.sh
      # Under shell: cmd, a failing command does not stop the script: each command
      # that must succeed is followed by || exit /b 1, and the end of the script
      # is explicit (without it, the step takes the code of the last command,
      # here an uninstall that rightly fails)
      # Version read by node with the path as argument (%CD%\package.json, so
      # never a nested quote: in a cmd for /f, an unescaped quote ends the
      # string), written to a file then read back by set /p
      # Each devzone output is written to sortie.txt then shown (type): a
      # failure shows what the command answered. The return code is read into
      # %SORTIE% before type, which would reset it
      - name: The devzone command through the npm .cmd shim (like a user)
        shell: cmd
        run: |
          node -p "require(process.argv[1]).version" %CD%\package.json > %RUNNER_TEMP%\version.txt || exit /b 1
          set /p VERSION=<%RUNNER_TEMP%\version.txt
          call npm pack --silent --pack-destination %RUNNER_TEMP% || exit /b 1
          call npm install -g %RUNNER_TEMP%\devzone-%VERSION%.tgz || exit /b 1
          call devzone --version > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          set /p LUE=<%RUNNER_TEMP%\sortie.txt
          if not "%LUE%"=="%VERSION%" exit /b 1
          call devzone --help > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          call devzone --option-inconnue > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          set DEVZONE_SANS_DEMARRER=1
          call devzone %RUNNER_TEMP%\dzcmd > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\Makefile exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\.devcontainer\devzone exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\manage\scripts\lancer.sh exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\manage\scripts\desinstaller.sh exit /b 1
          mkdir %RUNNER_TEMP%\plein || exit /b 1
          echo important > %RUNNER_TEMP%\plein\notes.txt
          call devzone %RUNNER_TEMP%\plein > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          if exist %RUNNER_TEMP%\plein\Makefile exit /b 1
          cd /d %RUNNER_TEMP% || exit /b 1
          call devzone desinstaller > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          exit /b 0

  # AI assistants on arm64 (Apple Silicon Mac), which the x86_64 jobs do not see
  # (#194): the devzone script of the container installs the pinned versions
  # (Ubuntu 24.04, glibc, Node LTS like the image and its node feature), then
  # claude and opencode must answer. A version bump of an assistant touches
  # .devcontainer/devzone: this job validates it before the merge
  ia-arm64:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: devzone enable ia, then claude --version and opencode --version
        env:
          DEVZONE_ETAT: ${{ runner.temp }}/devzone-modules
        run: |
          uname -m
          node --version
          bash .devcontainer/devzone enable ia
          claude --version
          opencode --version

  # Unit tests (bats manage/test/) on every PR and every push of develop and
  # main (#192). ubuntu: the whole suite. macOS: /bin/bash (3.2, the system one)
  # first in PATH, for the scripts that run on the host or in CI (npm command,
  # lancer.sh, docker.sh, desinstaller.sh, versions.sh, ci-conteneur.sh);
  # devzone.bats tests the container command (Linux)
  bats:
    # Whole suite on ubuntu split into four shards (manage/test/shard.sh):
    # in one job it went past its timeout as the suite grew (#522)
    name: bats (${{ matrix.os }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.total) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 4 }
          - { os: ubuntu-latest, shard: 2, total: 4 }
          - { os: ubuntu-latest, shard: 3, total: 4 }
          - { os: ubuntu-latest, shard: 4, total: 4 }
          - { os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: System bash 3.2 first in PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >>"$GITHUB_PATH"
      - name: bats manage/test/ (ubuntu, shard)
        if: runner.os == 'Linux'
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          # One file name per line, no spaces: word splitting is wanted here
          # shellcheck disable=SC2046
          npx --yes bats@1.10.0 $(bash manage/test/shard.sh "$SHARD" "$TOTAL")
      - name: bats of the host scripts under bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          bash --version | head -1
          bash -c '[ "${BASH_VERSINFO[0]}" = 3 ]'
          npx --yes bats@1.10.0 manage/test/cli.bats manage/test/versions.bats manage/test/ci-conteneur.bats manage/test/agent.bats manage/test/agent-ecarts.bats manage/test/agent-droits.bats manage/test/agent-droits-gh.bats manage/test/agent-quota.bats manage/test/agent-parallele.bats manage/test/agent-chemins.bats manage/test/agent-etat-json.bats

  # Code in English: files listed in .english are checked on every run (#502)
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: english check
        run: bash manage/scripts/check-english.sh

  # Summary required to merge (requiredChecks): always run, never "skipped"
  # (GitHub would count a skipped job as passed)
  tests-conteneur:
    needs: [changements, fonctionnel, cli, windows, ia-arm64, bats]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Container tests passed, or not needed
        env:
          TESTER: ${{ needs.changements.outputs.tester }}
          CHANGEMENTS: ${{ needs.changements.result }}
          FONCTIONNEL: ${{ needs.fonctionnel.result }}
          CLI: ${{ needs.cli.result }}
          WINDOWS: ${{ needs.windows.result }}
          IA_ARM64: ${{ needs.ia-arm64.result }}
          BATS: ${{ needs.bats.result }}
        run: bash manage/test/ci-conteneur.sh synthese "$TESTER" "$CHANGEMENTS" "$FONCTIONNEL" "$CLI" "$WINDOWS" "$IA_ARM64" "$BATS"
