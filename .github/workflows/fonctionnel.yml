# Tests fonctionnels : construit un devzone isolé et joue les scénarios d'un
# utilisateur (outils, modules, Kubernetes avec kind, hooks, redémarrage,
# rebuild) ; même script qu'en local (make test-fonctionnel). Job cli : la CLI
# tapée dans un vrai terminal, chaque commande avec un délai maximal (make
# test-cli). Job windows : fins de ligne, paquet npm (installé dans un préfixe
# isolé, jamais le global de la machine) et commande devzone sous windows-latest
# (core/test/windows.sh, jouable en local), puis même parcours via cmd avec une
# installation réellement globale (raccourci .cmd de npm, le cas d'un utilisateur
# Windows). Job ia-arm64 : assistants IA installés aux versions figées sur
# arm64 (Mac Apple Silicon), claude et opencode vérifiés.
#
# Exigés pour merger, dans develop comme dans main (livraison), par la
# vérification de synthèse tests-conteneur (requiredChecks, .repowarden.conf).
# Le workflow tourne sur chaque PR (aucun filtre paths : la synthèse doit
# toujours exister) ; le job changements décide par chemin : fonctionnel, cli,
# windows et ia-arm64 (une dizaine de minutes chacun, 15 pour windows) ne
# tournent que si la PR touche le conteneur, les tests, la CLI, .gitattributes
# ou package.json (core/test/ci-conteneur.sh) ; une PR de docs seule n'attend pas.
# Job bats : bats core/test/ (tests unitaires) sur chaque PR, sans décision
# par chemin (quelques secondes ; un test peut lire la doc ou un workflow),
# sous ubuntu et sous macOS avec le bash 3.2 du système (scripts de l'hôte).
# tests-conteneur réussit si bats a réussi et si les quatre autres ont réussi,
# ou s'ils n'avaient pas à tourner ; un échec ou une annulation la fait
# échouer. Push sur develop et main : bats seul. À la main : tout tourne.
name: fonctionnel

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonctionnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tester: ${{ steps.detection.outputs.tester }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # base et tête de la PR, pour la liste des fichiers changés
      - name: Fichiers changés touchant le conteneur, les tests ou la CLI
        id: detection
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE...$TETE" >changes.txt
              cat changes.txt
              tester="$(bash core/test/ci-conteneur.sh a-tester <changes.txt)"
              ;;
            push) tester=false ;; # develop et main : déjà testés par la PR, bats seul
            *) tester=true ;;     # à la main : tout tourne
          esac
          echo "tester=$tester"
          echo "tester=$tester" >>"$GITHUB_OUTPUT"

  fonctionnel:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: bash core/test/fonctionnel.sh

  cli:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: bash core/test/cli-terminal.sh

  windows:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Réglages d'un poste Windows ; avant le checkout, sinon la copie est déjà faite
      - name: Checkout avec core.autocrlf true (comme un poste Windows)
        shell: cmd
        run: |
          git config --global core.autocrlf true
          git config --global core.safecrlf false
      - uses: actions/checkout@v7
      # Les fins de ligne sont vérifiées par core/test/windows.sh (même critère que la
      # garde de core/test/cli.bats : tout fichier suivi commençant par #!, Makefile)
      - name: Tests Windows sous Git Bash (core/test/windows.sh)
        shell: bash
        run: bash core/test/windows.sh
      # Sous shell: cmd, une commande qui échoue n'arrête pas le script : chaque
      # commande qui doit réussir est suivie de || exit /b 1, et la fin du
      # script est explicite (sans elle, l'étape prend le code de la dernière
      # commande, ici un desinstaller qui échoue à raison)
      # Version lue par node avec le chemin en argument (%CD%\package.json, donc
      # jamais de quote imbriquée : dans un for /f de cmd, une ' non échappée
      # termine la chaîne), écrite dans un fichier puis relue par set /p
      # Chaque sortie de devzone est écrite dans sortie.txt puis affichée
      # (type) : un échec montre ce que la commande a répondu. Le code retour
      # est lu dans %SORTIE% avant le type, qui le remettrait à zéro
      - name: La commande devzone via le raccourci .cmd de npm (comme un utilisateur)
        shell: cmd
        run: |
          node -p "require(process.argv[1]).version" %CD%\package.json > %RUNNER_TEMP%\version.txt || exit /b 1
          set /p VERSION=<%RUNNER_TEMP%\version.txt
          call npm pack --silent --pack-destination %RUNNER_TEMP% || exit /b 1
          call npm install -g %RUNNER_TEMP%\devzone-%VERSION%.tgz || exit /b 1
          call devzone --version > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          set /p LUE=<%RUNNER_TEMP%\sortie.txt
          if not "%LUE%"=="%VERSION%" exit /b 1
          call devzone --help > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          call devzone --option-inconnue > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          set DEVZONE_SANS_DEMARRER=1
          call devzone %RUNNER_TEMP%\dzcmd > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\Makefile exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\.devcontainer\devzone exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\core\scripts\lancer.sh exit /b 1
          if not exist %RUNNER_TEMP%\dzcmd\core\scripts\desinstaller.sh exit /b 1
          mkdir %RUNNER_TEMP%\plein || exit /b 1
          echo important > %RUNNER_TEMP%\plein\fichier
          call devzone %RUNNER_TEMP%\plein > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          if exist %RUNNER_TEMP%\plein\Makefile exit /b 1
          cd /d %RUNNER_TEMP% || exit /b 1
          call devzone desinstaller > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          exit /b 0

  # Assistants IA sur arm64 (Mac Apple Silicon), que les jobs x86_64 ne voient
  # pas (#194) : le script devzone du conteneur installe les versions figées
  # (Ubuntu 24.04, glibc, Node LTS comme l'image et sa feature node), puis
  # claude et opencode doivent répondre. Une montée de version d'un assistant
  # touche .devcontainer/devzone : ce job la valide avant le merge
  ia-arm64:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: devzone activer ia, puis claude --version et opencode --version
        env:
          DEVZONE_ETAT: ${{ runner.temp }}/devzone-modules
        run: |
          uname -m
          node --version
          bash .devcontainer/devzone activer ia
          claude --version
          opencode --version

  # Tests unitaires (bats core/test/) sur chaque PR et chaque push de develop
  # et main (#192). ubuntu : toute la suite. macOS : /bin/bash (3.2, celui du
  # système) en tête du PATH, pour les scripts qui tournent sur l'hôte ou en
  # CI (commande npm, lancer.sh, docker.sh, desinstaller.sh, versions.sh,
  # ci-conteneur.sh) ; devzone.bats teste la commande du conteneur (Linux)
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: bash 3.2 du système en tête du PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >>"$GITHUB_PATH"
      - name: bats core/test/ (ubuntu)
        if: runner.os == 'Linux'
        run: npx --yes bats@1.10.0 core/test/
      - name: bats des scripts de l'hôte sous bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          bash --version | head -1
          bash -c '[ "${BASH_VERSINFO[0]}" = 3 ]'
          npx --yes bats@1.10.0 core/test/cli.bats core/test/versions.bats core/test/ci-conteneur.bats

  # Synthèse exigée pour merger (requiredChecks) : toujours lancée, jamais
  # « skipped » (GitHub compterait un job sauté comme réussi)
  tests-conteneur:
    needs: [changements, fonctionnel, cli, windows, ia-arm64, bats]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tests du conteneur réussis, ou sans objet
        env:
          TESTER: ${{ needs.changements.outputs.tester }}
          CHANGEMENTS: ${{ needs.changements.result }}
          FONCTIONNEL: ${{ needs.fonctionnel.result }}
          CLI: ${{ needs.cli.result }}
          WINDOWS: ${{ needs.windows.result }}
          IA_ARM64: ${{ needs.ia-arm64.result }}
          BATS: ${{ needs.bats.result }}
        run: bash core/test/ci-conteneur.sh synthese "$TESTER" "$CHANGEMENTS" "$FONCTIONNEL" "$CLI" "$WINDOWS" "$IA_ARM64" "$BATS"
