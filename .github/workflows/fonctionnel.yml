# Pod-workspace tests on kind (#869). Job fonctionnel: builds the workspace
# image, loads it into kind, installs charts/devzone-workspace and exercises
# devzone workspace start|status|stop plus a module command. Job cli: keeps the
# host CLI checks and runs the same kind pod scenario. Job windows: keeps line
# endings and npm shim checks; pod-on-kind is not runnable on windows-latest
# GitHub runners cannot run the Linux kind pod scenario, so the job records this limit and Linux
# jobs provide the pod coverage. Job ia-arm64: keeps AI assistant checks and
# runs the same pod-on-kind scenario on Linux arm64.
#
# Required to merge, in develop as in main (livraison), through the
# tests-conteneur summary check (requiredChecks, .repowarden.conf). The workflow
# runs on every PR (no paths filter: the summary must always exist); the
# changements job decides by path: fonctionnel, cli, windows and ia-arm64 (about
# ten minutes each, 15 for windows) only run when the PR touches the container,
# the tests, the CLI, .gitattributes or package.json (manage/test/ci-container.sh);
# a docs-only PR does not wait. Job bats: bats manage/test/ (unit tests) on every
# PR, with no path decision (a test can read the docs or a workflow), on ubuntu
# and on macOS with the system bash 3.2 (host scripts). tests-conteneur passes
# when bats passed and the four others passed, or did not have to run; a failure
# or a cancellation makes it fail. Push on develop and main: bats only. By hand:
# everything runs.
name: fonctionnel

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonctionnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tester: ${{ steps.detection.outputs.tester }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # base and head of the PR, for the list of changed files
      - name: Changed files touching the container, the tests or the CLI
        id: detection
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE...$TETE" >changes.txt
              cat changes.txt
              tester="$(bash manage/test/ci-container.sh a-tester <changes.txt)"
              ;;
            push) tester=false ;; # develop and main: already tested by the PR, bats only
            *) tester=true ;;     # by hand: everything runs
          esac
          echo "tester=$tester"
          echo "tester=$tester" >>"$GITHUB_OUTPUT"

  fonctionnel:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Runner Docker DNS
        run: bash manage/scripts/ci/ci-dns.sh
      - name: Install kind, kubectl, helm
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          bin_dir="${RUNNER_TEMP}/devzone-tools"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >>"$GITHUB_PATH"
          tmp="$(mktemp -d)"
          kind_version=0.33.0
          case "$arch" in
            arm64) kind_sha=20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2 ;;
            amd64) kind_sha=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d ;;
          esac
          curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/v${kind_version}/kind-linux-${arch}" -o "$tmp/kind"
          echo "$kind_sha  $tmp/kind" | sha256sum -c --quiet
          install -m 0755 "$tmp/kind" "$bin_dir/kind"
          kubectl_version=v1.37.3
          curl -fsSL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${arch}/kubectl" -o "$tmp/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${arch}/kubectl.sha256" -o "$tmp/kubectl.sha256"
          echo "$(cat "$tmp/kubectl.sha256")  $tmp/kubectl" | sha256sum -c --quiet
          install -m 0755 "$tmp/kubectl" "$bin_dir/kubectl"
          helm_version=v4.3.2
          helm_tarball="helm-${helm_version}-linux-${arch}.tar.gz"
          curl -fsSL "https://get.helm.sh/${helm_tarball}" -o "$tmp/$helm_tarball"
          curl -fsSL "https://get.helm.sh/${helm_tarball}.sha256sum" -o "$tmp/$helm_tarball.sha256sum"
          (cd "$tmp" && sha256sum -c --quiet "$helm_tarball.sha256sum")
          tar -xzf "$tmp/$helm_tarball" -C "$tmp" "linux-${arch}/helm"
          install -m 0755 "$tmp/linux-${arch}/helm" "$bin_dir/helm"
          rm -rf "$tmp"
      - name: Pod workspace on kind (start/status/stop + module)
        env:
          DEVZONE_KIND_CLUSTER: devzone-ci-fonctionnel
        run: bash manage/test/functional.sh

  cli:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Runner Docker DNS
        run: bash manage/scripts/ci/ci-dns.sh
      - name: Install kind, kubectl, helm
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          bin_dir="${RUNNER_TEMP}/devzone-tools"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >>"$GITHUB_PATH"
          tmp="$(mktemp -d)"
          kind_version=0.33.0
          case "$arch" in
            arm64) kind_sha=20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2 ;;
            amd64) kind_sha=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d ;;
          esac
          curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/v${kind_version}/kind-linux-${arch}" -o "$tmp/kind"
          echo "$kind_sha  $tmp/kind" | sha256sum -c --quiet
          install -m 0755 "$tmp/kind" "$bin_dir/kind"
          kubectl_version=v1.37.3
          curl -fsSL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${arch}/kubectl" -o "$tmp/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${arch}/kubectl.sha256" -o "$tmp/kubectl.sha256"
          echo "$(cat "$tmp/kubectl.sha256")  $tmp/kubectl" | sha256sum -c --quiet
          install -m 0755 "$tmp/kubectl" "$bin_dir/kubectl"
          helm_version=v4.3.2
          helm_tarball="helm-${helm_version}-linux-${arch}.tar.gz"
          curl -fsSL "https://get.helm.sh/${helm_tarball}" -o "$tmp/$helm_tarball"
          curl -fsSL "https://get.helm.sh/${helm_tarball}.sha256sum" -o "$tmp/$helm_tarball.sha256sum"
          (cd "$tmp" && sha256sum -c --quiet "$helm_tarball.sha256sum")
          tar -xzf "$tmp/$helm_tarball" -C "$tmp" "linux-${arch}/helm"
          install -m 0755 "$tmp/linux-${arch}/helm" "$bin_dir/helm"
          rm -rf "$tmp"
      - name: CLI terminal checks (no container mode)
        run: bash manage/test/cli-terminal.sh
      - name: Pod workspace on kind (start/status/stop + module)
        env:
          DEVZONE_KIND_CLUSTER: devzone-ci-cli
        run: bash manage/test/functional.sh

  windows:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Windows workstation settings; before the checkout, otherwise the copy is already made
      - name: Checkout with core.autocrlf true (like a Windows workstation)
        shell: cmd
        run: |
          git config --global core.autocrlf true
          git config --global core.safecrlf false
      - uses: actions/checkout@v7
      # Line endings are checked by manage/test/windows.sh (same rule as the guard of
      # manage/test/cli.bats: every tracked file starting with #!, Makefile)
      - name: Windows tests under Git Bash (manage/test/windows.sh)
        shell: bash
        run: bash manage/test/windows.sh
      - name: Pod-on-kind not runnable on Windows runners
        shell: bash
        run: |
          echo "windows-latest GitHub runners cannot run the Linux kind pod scenario."
          echo "Pod-on-kind coverage is provided by fonctionnel/cli/ia-arm64 Linux jobs."
      # Under shell: cmd, a failing command does not stop the script: each command
      # that must succeed is followed by || exit /b 1, and the end of the script
      # is explicit (without it, the step takes the code of the last command,
      # here an uninstall that rightly fails)
      - name: The devzone command through the npm .cmd shim (like a user)
        shell: cmd
        run: |
          node -p "require(process.argv[1]).version" %CD%\package.json > %RUNNER_TEMP%\version.txt || exit /b 1
          set /p VERSION=<%RUNNER_TEMP%\version.txt
          call npm pack --silent --pack-destination %RUNNER_TEMP% || exit /b 1
          call npm install -g %RUNNER_TEMP%\devzone-%VERSION%.tgz || exit /b 1
          call devzone --version > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          set /p LUE=<%RUNNER_TEMP%\sortie.txt
          if not "%LUE%"=="%VERSION%" exit /b 1
          call devzone --help > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if not %SORTIE% equ 0 exit /b 1
          call devzone --option-inconnue > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          set DEVZONE_NO_START=1
          call devzone %RUNNER_TEMP%\dzcmd --docker > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          if exist %RUNNER_TEMP%\dzcmd exit /b 1
          mkdir %RUNNER_TEMP%\plein || exit /b 1
          echo important > %RUNNER_TEMP%\plein\notes.txt
          call devzone %RUNNER_TEMP%\plein > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          if exist %RUNNER_TEMP%\plein\Makefile exit /b 1
          cd /d %RUNNER_TEMP% || exit /b 1
          call devzone uninstall > %RUNNER_TEMP%\sortie.txt 2>&1
          set SORTIE=%errorlevel%
          type %RUNNER_TEMP%\sortie.txt
          if %SORTIE% equ 0 exit /b 1
          exit /b 0

  # AI assistants on arm64 (Apple Silicon Mac), which the x86_64 jobs do not see
  # (#194): keep the original assistant check, and also run the pod-on-kind
  # workspace scenario on this Linux arm64 runner.
  ia-arm64:
    needs: changements
    if: needs.changements.outputs.tester == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      # State writes (enable ai) are a Go pod command: provide the binary as in
      # the bats jobs, so this real arm64 host run does not need a shell fallback
      - name: Go binary of the pod for the arm64 host
        run: go build -o ".devcontainer/bin/devzone-pod-linux-$(go env GOARCH)" ./cmd/devzone-pod
      - name: devzone enable ai, then claude --version and opencode --version
        env:
          DEVZONE_STATE: ${{ runner.temp }}/devzone-modules
        run: |
          uname -m
          node --version
          bash .devcontainer/devzone enable ai
          claude --version
          opencode --version
      - name: Install kind, kubectl, helm
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          bin_dir="${RUNNER_TEMP}/devzone-tools"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >>"$GITHUB_PATH"
          tmp="$(mktemp -d)"
          kind_version=0.33.0
          case "$arch" in
            arm64) kind_sha=20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2 ;;
            amd64) kind_sha=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d ;;
          esac
          curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/v${kind_version}/kind-linux-${arch}" -o "$tmp/kind"
          echo "$kind_sha  $tmp/kind" | sha256sum -c --quiet
          install -m 0755 "$tmp/kind" "$bin_dir/kind"
          kubectl_version=v1.37.3
          curl -fsSL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${arch}/kubectl" -o "$tmp/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${arch}/kubectl.sha256" -o "$tmp/kubectl.sha256"
          echo "$(cat "$tmp/kubectl.sha256")  $tmp/kubectl" | sha256sum -c --quiet
          install -m 0755 "$tmp/kubectl" "$bin_dir/kubectl"
          helm_version=v4.3.2
          helm_tarball="helm-${helm_version}-linux-${arch}.tar.gz"
          curl -fsSL "https://get.helm.sh/${helm_tarball}" -o "$tmp/$helm_tarball"
          curl -fsSL "https://get.helm.sh/${helm_tarball}.sha256sum" -o "$tmp/$helm_tarball.sha256sum"
          (cd "$tmp" && sha256sum -c --quiet "$helm_tarball.sha256sum")
          tar -xzf "$tmp/$helm_tarball" -C "$tmp" "linux-${arch}/helm"
          install -m 0755 "$tmp/linux-${arch}/helm" "$bin_dir/helm"
          rm -rf "$tmp"
      - name: Pod workspace on kind (start/status/stop + module)
        env:
          DEVZONE_KIND_CLUSTER: devzone-ci-arm64
        run: bash manage/test/functional.sh

  # Unit tests (bats manage/test/) on every PR and every push of develop and
  # main (#192). ubuntu: the whole suite. macOS: /bin/bash (3.2, the system one)
  # first in PATH, for the scripts that run on the host or in CI (npm command,
  # launch.sh, docker.sh, uninstall.sh, versions.sh, ci-container.sh);
  # devzone.bats tests the container command (Linux)
  bats:
    # Whole suite on ubuntu split into four shards (manage/test/shard.sh):
    # in one job it went past its timeout as the suite grew (#522)
    name: bats (${{ matrix.os }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.total) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 4 }
          - { os: ubuntu-latest, shard: 2, total: 4 }
          - { os: ubuntu-latest, shard: 3, total: 4 }
          - { os: ubuntu-latest, shard: 4, total: 4 }
          - { os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: System bash 3.2 first in PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >>"$GITHUB_PATH"
      # The remaining shell calls the commands ported to Go (devzone postgres,
      # mysql, cluster clean…): the pod binary of this commit, in the place where
      # the launcher looks for it (#864)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - name: Go binary of the pod for the bats (Linux)
        if: runner.os == 'Linux'
        run: go build -o ".devcontainer/bin/devzone-pod-linux-$(go env GOARCH)" ./cmd/devzone-pod
      # The macOS job runs the host scripts under bash 3.2: a Linux binary would
      # not run there, so the launcher gets a binary of this host (state writes)
      - name: Go binary of the pod for the bats (macOS)
        if: runner.os == 'macOS'
        run: go build -o ".devcontainer/bin/devzone-pod-darwin-$(go env GOARCH)" ./cmd/devzone-pod
      - name: bats manage/test/ (ubuntu, shard)
        if: runner.os == 'Linux'
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          # One file name per line, no spaces: word splitting is wanted here
          # shellcheck disable=SC2046
          npx --yes bats@1.10.0 $(bash manage/test/shard.sh "$SHARD" "$TOTAL")
      - name: bats of the host scripts under bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          bash --version | head -1
          bash -c '[ "${BASH_VERSINFO[0]}" = 3 ]'
          # Agent tests were ported to Go (#878); their behavior is checked by
          # `go test ./internal/domain/agent/` in the go workflow.
          npx --yes bats@1.10.0 manage/test/cli.bats manage/test/versions.bats manage/test/ci-container.bats

  # Code in English: the Go check scans every tracked code file on every run (#502).
  # The charts convention (#554) is checked here too: manage/scripts/ci/check-charts.sh
  # and $NAME before a non-ASCII byte in the shell scripts (#591): check-utf8-vars.sh
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: english check (Go)
        run: go run ./cmd/devzone-checks english
      - name: names check (files and folders in English, #716)
        run: bash manage/scripts/ci/check-names.sh
      # helm is installed on the runner: lint and render of each chart, wrapper
      # dependency pulled anonymously (OCI)
      - name: charts convention (manage/scripts/ci/check-charts.sh)
        run: bash manage/scripts/ci/check-charts.sh
      - name: utf8 variables (manage/scripts/ci/check-utf8-vars.sh)
        run: bash manage/scripts/ci/check-utf8-vars.sh

  # Summary required to merge (requiredChecks): always run, never "skipped"
  # (GitHub would count a skipped job as passed)
  tests-conteneur:
    needs: [changements, fonctionnel, cli, windows, ia-arm64, bats]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lets the diagnostic step list the jobs of this run (#636)
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      # Bats jobs that never got a runner (cancelled after about 15 minutes, no
      # step): says so and gives the rerun command. Exits 0 and changes no verdict
      - name: Diagnostic of jobs that never started
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash manage/test/ci-container.sh diagnostic "$REPO" "$RUN_ID"
      - name: Container tests passed, or not needed
        env:
          TESTER: ${{ needs.changements.outputs.tester }}
          CHANGEMENTS: ${{ needs.changements.result }}
          FONCTIONNEL: ${{ needs.fonctionnel.result }}
          CLI: ${{ needs.cli.result }}
          WINDOWS: ${{ needs.windows.result }}
          IA_ARM64: ${{ needs.ia-arm64.result }}
          BATS: ${{ needs.bats.result }}
        run: bash manage/test/ci-container.sh synthese "$TESTER" "$CHANGEMENTS" "$FONCTIONNEL" "$CLI" "$WINDOWS" "$IA_ARM64" "$BATS"
