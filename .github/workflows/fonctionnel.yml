# Tests fonctionnels : construit un devzone isolé et joue les scénarios d'un
# utilisateur (outils, modules, Kubernetes avec kind, hooks, redémarrage,
# rebuild) ; même script qu'en local (make test-fonctionnel). Job cli : la CLI
# tapée dans un vrai terminal, chaque commande avec un délai maximal (make
# test-cli). Lancés quand le conteneur, les tests ou la CLI changent, et à la
# main. Non exigés pour merger (durée : une dizaine de minutes chacun).
name: fonctionnel

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "test/**"
      - "bin/**"
      - "Makefile"
      - "lancer.sh"
      - "desinstaller.sh"
      - ".github/workflows/fonctionnel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonctionnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fonctionnel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: bash test/fonctionnel.sh

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: bash test/cli-terminal.sh
