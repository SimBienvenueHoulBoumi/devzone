# Automatic rerun, once, of the jobs that never started (#656): macOS runners
# sometimes never come, the job is cancelled after about 15 minutes without a
# single step, and tests-conteneur then fails. When the fonctionnel run ends in
# failure, this workflow asks GitHub to rerun the failed jobs, but only if
# manage/test/ci-conteneur.sh relancer finds a job that never started and no
# other failure (a real failure is never hidden), and only on the first attempt
# (run_attempt == 1: no loop). Limit: a workflow_run only runs from the default
# branch, so it acts once the first delivery containing it has reached main.
# Safety: it checks out the default branch (never the code of the pull request)
# and uses only the id of the run, never any text coming from the pull request.
name: relance-ci

on:
  workflow_run:
    workflows: [fonctionnel]
    types: [completed]

permissions: {}

jobs:
  relancer:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Rerun the jobs that never started, once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bash manage/test/ci-conteneur.sh relancer "$REPO" "$RUN_ID" "$ATTEMPT"
