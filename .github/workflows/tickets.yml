# Ticket tracking: the ticket first, the branch follows (created on
# validation, linked to the ticket), the first push opens the draft PR;
# statuses kept up to date until production.
name: tickets

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled, assigned, closed]
  push:
    branches-ignore: [main, master, develop]

permissions: {}

jobs:
  tickets:
    uses: simdevWarden/repowarden/.github/workflows/tickets.yml@v4
    permissions: { contents: write, issues: write, pull-requests: write, statuses: write }
    # GitHub App (repowarden app init): its actions trigger the other workflows
    # auto-create: true = creates a ticket to validate for a PR without ticket,
    # false = the check fails with the steps to follow (default false)
    with:
      app-client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
      auto-create: false
    secrets:
      app-key: ${{ secrets.REPOWARDEN_APP_KEY }}
