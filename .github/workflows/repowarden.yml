# repowarden checks in CI, the same as the workstation hooks, plus the PR
# itself: title and description (they become the squash commit message), AI
# agent signatures refused. Required to merge (repowarden proteger).
name: repowarden

on:
  pull_request:
    # edited: checks again when the PR title or description changes
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # fix-pr: a PR aimed at the wrong branch is retargeted to develop

jobs:
  repowarden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: commit messages, diff from the base
      - uses: simdevWarden/repowarden@v4
        with:
          # Only develop goes into main: a work PR opened against main is
          # retargeted to develop before the checks
          fix-pr: "true"
