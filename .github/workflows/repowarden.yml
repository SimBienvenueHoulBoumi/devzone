# Vérifications repowarden en CI, les mêmes que les hooks du poste, plus la PR
# elle-même : titre et description (devenus le message du commit en squash),
# signatures d'agent IA refusées. Exigées pour merger (repowarden proteger).
name: repowarden

on:
  pull_request:
    # edited : revérifie quand le titre ou la description de la PR change
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repowarden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet : messages de commit, diff depuis la base
      - uses: simdevWarden/repowarden@v4
