# Automatic version bumps of the pinned tools of the container: repowarden
# (versions.env) and AI assistants (one IA_ line per package, devzone).
# Compared every hour and by hand; for each package behind, opens the ticket
# (or updates the one already open), proposes a design, creates the ticket
# branch, applies the bump, commits and pushes: the draft PR opens through the
# usual flow, the CI tests the container.
#
# The GitHub App (REPOWARDEN_APP_CLIENT_ID, REPOWARDEN_APP_KEY) signs the
# actions: the push triggers the CI and the ticket tracking, like the other
# workflows.
#
# The posted design is "## Conception proposée", never "retenue": the ticket
# check only accepts a design from the maintainer, who takes it over
# ("## Conception retenue") on the ticket, then marks the PR ready.
#
# Accepted exception (version bumps only): the workflow validates the ticket it
# creates, so that the ticket branch can be created; the human control stays the
# retained design and marking the PR ready.
#
# A ticket with the same title opened by someone else is ignored: it cannot
# block the bumps.
# No cross trigger from repowarden: it would need a token of another owner;
# without a new version, the job stops after the comparison.
name: versions

on:
  schedule:
    - cron: "17 * * * *" # every hour at minute 17
  workflow_dispatch: # by hand (Actions -> versions -> Run workflow)

permissions: {}

# One comparison at a time: two runs must not open the same ticket
concurrency:
  group: versions
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The App token only exists when the comparison finds a package behind:
      # so the checkout uses the default token, without keeping its
      # credentials, then the remote is rewritten with the App token before
      # the pushes (see below).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # ticket branches and full histories
      - name: Compare the pinned versions with npm
        id: retards
        run: |
          bash manage/scripts/versions.sh > retards.txt
          cat retards.txt
          if [ -s retards.txt ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi
      - name: GitHub App token
        if: steps.retards.outputs.present == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOWARDEN_APP_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Git identity of the App
        if: steps.retards.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          slug="${{ steps.app.outputs.app-slug }}"
          id="$(gh api "users/${slug}[bot]" --jq .id)"
          git config user.name "${slug}[bot]"
          git config user.email "${id}+${slug}[bot]@users.noreply.github.com"
      - name: Repowarden at the same pinned version as the container
        if: steps.retards.outputs.present == 'true'
        run: |
          version="$(sed -nE 's/^REPOWARDEN_VERSION=([^[:space:]]+)$/\1/p' .devcontainer/versions.env | head -1)"
          npm install -g "repowarden@$version"
      # The remote carries the App token: the pushes of the loop below are signed
      # by the App, which triggers the CI and the ticket tracking.
      - name: Remote with the App token for the pushes
        if: steps.retards.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Ticket and PR for each package behind
        if: steps.retards.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          while read -r paquet ancienne nouvelle; do
            [ -n "$paquet" ] || continue
            titre="$paquet $nouvelle dans le conteneur"
            # A ticket opened by the App already exists for this package (title "package ...");
            # same title opened by someone else: ignored, it does not block the bump.
            existant="$(bash manage/scripts/versions.sh --ticket-existant "$paquet" "app/${APP_SLUG}")"
            if [ -n "$existant" ]; then
              n="${existant%%$'\t'*}"
              titre_existant="${existant#*$'\t'}"
              if [ "$titre_existant" != "$titre" ]; then
                gh issue edit "$n" --title "$titre"
                gh issue comment "$n" --body "Nouvelle version npm : $nouvelle (la version figée était $ancienne)."
              fi
              continue
            fi
            notes="https://www.npmjs.com/package/$paquet/v/$nouvelle"
            corps="$(cat <<EOF
          ## Besoin
          La version figée de $paquet dans le conteneur ($ancienne) est dépassée : la dernière version npm est $nouvelle.

          ## Notes de version
          $notes

          ## Terminé quand…
          - [ ] $paquet@$nouvelle est figé dans le fichier du conteneur
          - [ ] les tests fonctionnels et la CLI passent sur la PR
          EOF
            )"
            n="$(repowarden ticket nouveau "$titre" --type chore --description "$corps" --porcelain)"
            conception="$(cat <<EOF
          ## Conception proposée

          À confirmer par le mainteneur (« ## Conception retenue ») : la vérification \`ticket\` de la PR l'attend.

          - Monter \`$paquet\` de \`$ancienne\` à \`$nouvelle\` (dernière version npm).
          - \`manage/scripts/versions.sh --appliquer $paquet $nouvelle\` remplace la seule version figée, dans son fichier.
          - Commit \`chore(devcontainer): $paquet $nouvelle\`, puis push : la PR brouillon s'ouvre, la CI teste le conteneur.
          EOF
            )"
            repowarden ticket comment "$n" "$conception"
            # Validated automatically so that the ticket branch can be created
            repowarden ticket label "$n" validé
            repowarden ticket "$n"
            bash manage/scripts/versions.sh --appliquer "$paquet" "$nouvelle"
            # versions.env holds the repowarden version since #503
            git add -- .devcontainer/versions.env .devcontainer/devzone
            repowarden cc -m "$paquet $nouvelle" \
              --type chore --scope devcontainer \
              --body "Monte $paquet de $ancienne à $nouvelle, dernière version npm." \
              --refs "Ticket : #$n"
            git push -u origin "$(git branch --show-current)"
          done <retards.txt
