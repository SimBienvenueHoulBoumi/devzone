# Réglages repowarden de devzone (appliqués aux hooks et à la CI)
[repowarden]
    version = 4
    lang = fr
    # Flux develop → main : le travail s'intègre dans develop (préversions),
    # seul develop entre dans main (livraison)
    integrationBranch = develop
    protectedBranches = main develop
    allowedBranches = main develop livraison/* dependabot/*
    # Livraison automatique : la GitHub App merge la PR de livraison dès que
    # ses vérifications sont vertes (release.yml : delivery-auto)
    deliveryApproval = auto
