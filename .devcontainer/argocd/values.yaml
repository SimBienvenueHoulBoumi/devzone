# Argo CD minimal (#411) : un seul réplica par composant, sans Dex ni
# notifications, serveur en ClusterIP (aucun Ingress, aucun LoadBalancer).
# L'accès passe par le relais kubectl port-forward du conteneur (8443:443).
global:
  domain: ""
dex:
  enabled: false
notifications:
  enabled: false
server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
controller:
  replicas: 1
repoServer:
  replicas: 1
applicationSet:
  replicas: 1
