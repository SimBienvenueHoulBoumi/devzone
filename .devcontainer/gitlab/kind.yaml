# Configuration kind pour le cluster de test GitLab.
# Utilisé par le module gitlab installer et par kube-config.sh au démarrage.
# Voir aussi .devcontainer/kube-config.sh et .devcontainer/metrics-server.sh.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8929
        protocol: TCP
      # Clone SSH : nodePort kind fixe 32022 → hostPort 2224 (port annoncé par GitLab)
      - containerPort: 32022
        hostPort: 2224
        protocol: TCP
