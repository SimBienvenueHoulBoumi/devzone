# valeurs pour le chart GitLab gitlab/gitlab (fixé à la v9.11.16)
# Éditions et configuration globale
global:
  edition: ce               # édition communautaire (Free)
  extraEnv:
    # GitLab refuse un host avec port ; il lit son port externe ici (URL web, clone HTTP, API)
    GITLAB_PORT: "8929"
  hosts:
    domain: localhost       # domaine de base
    https: false            # HTTPS désactivé pour le test
    gitlab:
      name: gitlab.localhost  # hostname GitLab
  ingress:
    enabled: false          # aucun Ingress : accès uniquement par relais port-forward
    configureCertmanager: false  # cert-manager non configuré
    tls:
      enabled: false        # TLS désactivé
  gatewayApi:
    configureCertmanager: false
  kas:
    enabled: false          # KAS non activé
  prometheus:
    install: false         # prometheus non installé (top-level aussi)
  registry:
    enabled: false         # registry non activé
  shell:
    port: 2224             # port SSH annoncé par GitLab pour le clone (ssh://git@gitlab.localhost:2224/...)

# cert-manager : désactivé
installCertmanager: false
prometheus:
  install: false
registry:
  enabled: false

# GitLab Runner : installé séparément (chart gitlab-runner)
gitlab-runner:
  install: false

# Aucun contrôleur d'Ingress ni port publié sur le nœud : les services
# restent en ClusterIP dans devzone-gitlab, joignables par relais port-forward
nginx-ingress:
  enabled: false

# Réplicas à 1 et ressources réduites
gitlab:
  # Metriques pour Prometheus : exporter desactive (inutile pour un test de
  # GitLab, pouvait provoquer un echec de helm --wait)
  gitlab-exporter:
    enabled: false
  webservice:
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
  sidekiq:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
  gitaly:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
  gitlab-shell:
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

certmanager-issuer: {}
