[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "calc"
version = "0.1.0"
description = "Module de calcul minimal pour démo GitLab"
requires-python = ">=3.12"

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
extend-select = ["E", "F", "I", "W"]
exclude = ["*.pyc", "__pycache__", ".git", ".ruff_cache"]