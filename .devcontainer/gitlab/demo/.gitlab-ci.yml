# Configuration CI GitLab pour le projet de démo Python.
# Lance ruff (lint) et pytest (tests) sur chaque push/MR.

image: python:3.12-slim

# Le paquet calc vit dans src/ et n'est pas installé : pytest le trouve ainsi
variables:
  PYTHONPATH: src

stages:
  - test

test:
  stage: test
  script:
    - pip install ruff pytest
    - ruff check .
    - pytest -q
