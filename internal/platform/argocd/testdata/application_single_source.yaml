apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devzone-workspace
  namespace: devzone-argocd
  labels:
    app.kubernetes.io/managed-by: devzone
    devzone.io/kind: workspace
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/acme/devzone.git
    targetRevision: v1.2.3
    path: charts/devzone-workspace
    helm:
      parameters:
        - name: image.tag
          value: "1.2.3"
        - name: networkPolicy.restrictEgress
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: devzone-workspace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
